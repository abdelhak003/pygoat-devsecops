# =============================================================================
#  SHIFT-LEFT — contrôles exécutés sur le poste du développeur AVANT chaque commit
#  Consignes : R3.3 (pre-commit hooks), R5.5 (exécution ciblée en local avant push)
#  Inspiré du Lab 1 « Pre-Commit Security Hooks » (version moderne des outils).
#
#  Installation (une seule fois) :   pip install pre-commit  &&  pre-commit install
#  Lancer à la main sur tout le code :  pre-commit run --all-files
#
#  ⚠️ `git commit --no-verify` contourne ces hooks : c'est pourquoi les MÊMES
#  contrôles sont rejoués dans le pipeline GitLab, où ils ne sont pas contournables.
#  Seuls les fichiers modifiés (staged) sont analysés → rapide (quelques secondes).
# =============================================================================

# Dossiers de labs pédagogiques indépendants, hors périmètre (cf. registre d'exemptions)
exclude: ^(challenge|dockerized_labs|Solutions)/

repos:
  # 1. Hygiène de base + détection de clés privées (fichiers .pem, id_rsa…)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key          # bloque une clé privée (Lab 1 : fake.key.pem)
      - id: check-added-large-files     # évite de commiter un dump / une base de données
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: check-yaml

  # 2. Secrets (clés API, tokens, mots de passe) — avec NOS règles (.gitleaks.toml)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # 3. SAST Python : failles spécifiques Python (eval, pickle, shell=True, yaml.load…)
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: [-ll, -ii]                # bloque seulement sévérité ET confiance >= MEDIUM

  # 4. SAST multi-langage : règles OWASP + règles maison
  - repo: https://github.com/semgrep/pre-commit
    rev: v1.179.0
    hooks:
      - id: semgrep
        args: [--config, p/python, --config, p/secrets, --error, --skip-unknown-extensions, --metrics=off]
